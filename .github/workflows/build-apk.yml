name: Build & Publish Android APK (SecureVault)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Platforms & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Angular Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Set Dynamic Version for Android Build
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK & Integrity Checksums
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SecureVault-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SecureVault.apk
          sha256sum ./SecureVault-v1.0.${{ github.run_number }}.apk | awk '{print $1}' > ./SecureVault-v1.0.${{ github.run_number }}.apk.sha256
          sha256sum ./SecureVault.apk | awk '{print $1}' > ./SecureVault.apk.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Android-APK-v1.0.${{ github.run_number }}
          path: |
            ./SecureVault*.apk
            ./SecureVault*.sha256
          retention-days: 30

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SecureVault v1.0.${{ github.run_number }} (Android APK)"
          body: |
            ## 🛡️ SecureVault v1.0.${{ github.run_number }} — Encrypted Credential Vault
            
            ### 📱 Android Installation:
            Download **[SecureVault.apk](https://github.com/Sabarish204/SecureVault/releases/download/v1.0.${{ github.run_number }}/SecureVault.apk)**
            
            ### 🚀 What's New in this Build:
            * **🔍 Universal Omnibar Global Search**:
              - Prominent top header search bar with `Ctrl + K` desktop shortcut and responsive mobile expansion.
              - Live categorized suggestions dropdown across payment cards, bank logins, settings (PIN, fingerprint, backups), and quick creation actions.
              - Searches by bank name, customer ID, card program, and last 4 digits (e.g. `6529`).
              - Streamlined bottom navigation bar with a balanced 4-item layout.
            * **📷 Physical Card Scanner (Front & Back) with 100% On-Device OCR**:
              - Scan or upload card photos directly in the card form with a live card viewfinder overlay.
              - Front side extracts Card Number (Luhn-validated), Expiry Date (MM/YY), Cardholder Name, and Card Brand.
              - Back side extracts CVV / Security Code.
              - 1-tap auto-fill review sheet; 100% local-first and offline with zero card data leaving your device.
            * **👆 Native Android Back Navigation & Swipe Gestures**:
              - Handled hardware back button via Capacitor: dismisses open modals first, navigates back smoothly through screens, and provides double-tap exit confirmation on Dashboard to prevent accidental app termination.
              - Touch edge-swipe navigation: Swipe left-to-right to navigate back, swipe right-to-left to navigate forward.
            * **📸 Feedback Modal Screenshots & In-App Update Enhancements**:
              - Attach up to 3 compressed screenshots/photos directly to bug reports and suggestions.
              - Fixed mobile scrolling and bottom navbar layering on modals.
              - Added "Download in Browser" 1-tap fallback for in-app update downloads.

            *Build: `#${{ github.run_number }}` • Commit: `${{ github.sha }}`*
          files: |
            ./SecureVault-v1.0.${{ github.run_number }}.apk
            ./SecureVault-v1.0.${{ github.run_number }}.apk.sha256
            ./SecureVault.apk
            ./SecureVault.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
