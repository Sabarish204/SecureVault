name: Build & Publish Android APK (SecureVault)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Platforms & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Angular Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Set Dynamic Version for Android Build
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK & Integrity Checksums
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SecureVault-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SecureVault.apk
          sha256sum ./SecureVault-v1.0.${{ github.run_number }}.apk | awk '{print $1}' > ./SecureVault-v1.0.${{ github.run_number }}.apk.sha256
          sha256sum ./SecureVault.apk | awk '{print $1}' > ./SecureVault.apk.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Android-APK-v1.0.${{ github.run_number }}
          path: |
            ./SecureVault*.apk
            ./SecureVault*.sha256
          retention-days: 30

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SecureVault v1.0.${{ github.run_number }} (Android APK)"
          body: |
            ## 🛡️ SecureVault v1.0.${{ github.run_number }} — Encrypted Credential Vault
            
            ### 📱 Android Installation:
            Download **[SecureVault.apk](https://github.com/Sabarish204/SecureVault/releases/download/v1.0.${{ github.run_number }}/SecureVault.apk)**
            
            ### 🚀 What's New in this Build:
            * **Progressive PIN Lockout & Anti-Brute-Force**:
              - Added rate limiting with progressive security cooldowns (30s after 5 failed attempts, 60s after 6–9 attempts, 5m after 10+ attempts).
              - Persistent cooldown timer across app refreshes/restarts with active countdown banner.
              - PIN inputs and biometric triggers automatically lock during cooldown periods.
            * **Universal Card Detection & Fixes**:
              - Fixed Indian RuPay 6529 range (`652150–653149`), preventing incorrect Discover classification.
              - Corrected JCB BIN range (`3528–3589`) and refreshed brand logo.
            * **Realistic Card Artwork & Themes**:
              - Tailored luxury presets for 30+ programs (HDFC Pixel, Millennia, Axis IndianOil, Kotak League, SBI BPCL Octane, ICICI Amex, etc.).
              - Procedural luxury theme generator for any unlisted cards worldwide.
              - Live interactive card preview inside the credential form as you type.
              - Added custom background image URL support (`cardImageUrl`).
            * **Responsive Card Mockup**:
              - Auto-stretching dynamic height and clamp typography to eliminate cardholder name or bottom row clipping on mobile screens.
            * **Backup & Verification Enhancements**:
              - Detailed backup export inspection modal showing UUID, byte size, and AES-256-GCM verification.
            * **Feedback & Diagnostics**:
              - Added smartphone full model mapping (e.g. `Samsung Galaxy A55 5G (SM-A556B)`) and Android OS version to in-app feedback dialog and GitHub issue reports for streamlined debugging.
              - Added structured GitHub Issue forms (.github/ISSUE_TEMPLATE) capturing full smartphone model and Android version.

            *Build: `#${{ github.run_number }}` • Commit: `${{ github.sha }}`*
          files: |
            ./SecureVault-v1.0.${{ github.run_number }}.apk
            ./SecureVault-v1.0.${{ github.run_number }}.apk.sha256
            ./SecureVault.apk
            ./SecureVault.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
