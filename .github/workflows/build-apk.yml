name: Build Android APK (SecureVault)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Angular Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/SecureVault.apk || true

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
