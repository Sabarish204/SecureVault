name: Build & Publish Android APK (SecureVault)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Angular Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SecureVault.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Android-APK
          path: ./SecureVault.apk
          retention-days: 30

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SecureVault v1.0.0 (Android APK)"
          body: |
            ## 🛡️ SecureVault — Personal Encrypted Credential Vault
            
            ### 📱 Android Installation:
            Download **[SecureVault.apk](https://github.com/Sabarish204/SecureVault/releases/download/v1.0.0/SecureVault.apk)** and tap install on your Android device!
            
            ### ✨ Features:
            - **Zero-Knowledge Architecture**: AES-256-GCM + PBKDF2 client-side encryption.
            - **50+ Indian Banks**: Searchable NetBanking directory & direct launch links.
            - **100% Offline**: Local-first storage with zero cloud leaks.
            - **Progressive Web App**: Mobile-first glassmorphic dark interface.
          files: |
            ./SecureVault.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
