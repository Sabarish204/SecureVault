<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle cyber circuit ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(129, 140, 248, 0.1)" stroke-width="1.5"/>

  <!-- Outer Glow Shield -->
  <path d="M 256 70 L 400 135 C 400 280 256 395 256 425 C 256 395 112 280 112 135 Z" 
        fill="url(#shieldGrad)" opacity="0.3" filter="url(#glow)"/>

  <!-- Main Shield -->
  <path d="M 256 85 L 385 142 C 385 270 256 375 256 402 C 256 375 127 270 127 142 Z" 
        fill="url(#coreGrad)" stroke="url(#shieldGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Inner Padlock -->
  <!-- Shackle -->
  <path d="M 206 230 V 195 C 206 167 228 145 256 145 C 284 145 306 167 306 195 V 230" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="186" y="220" width="140" height="115" rx="20" fill="url(#shieldGrad)" filter="url(#glow)"/>
  <rect x="190" y="224" width="132" height="107" rx="16" fill="#0f172a"/>

  <!-- Keyhole -->
  <circle cx="256" cy="265" r="12" fill="#38bdf8"/>
  <path d="M 250 268 L 262 268 L 265 298 L 247 298 Z" fill="#38bdf8"/>

  <!-- Status Light Accent -->
  <circle cx="256" cy="360" r="6" fill="#34d399" filter="url(#glow)"/>
</svg>
